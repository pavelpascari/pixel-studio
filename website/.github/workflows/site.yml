# Checks and builds the site on every PR and push; previews per PR, production on v* tags (Cloudflare Workers).
# Pinned to a release of the workflow (a full commit SHA is stricter); only the Cloudflare secrets are passed.
# GitHub runs workflows from the repository's .github/workflows/ only: move this file there.
on: [pull_request, push, workflow_dispatch]
jobs: { site: { uses: pavelpascari/astro-project-site/.github/workflows/deploy.yml@v0.1.0-beta.0, with: { working-directory: website }, permissions: { contents: read, pull-requests: write }, secrets: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" } } }
